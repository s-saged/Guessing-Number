<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess Game Pro FX</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top,#0f1530,#060810);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.gameBox{
    width:360px;
    padding:20px;
    background: rgba(255,255,255,0.05);
    border-radius:16px;
    text-align:center;
    position:relative;
    box-shadow:0 0 30px rgba(0,0,0,0.7);
    transition:0.3s;
}

h1{margin-bottom:10px}

select,input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:10px;
    background:#6c5ce7;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{background:#a29bfe}

/* META */
.meta{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-top:10px;
}

/* HISTORY */
#history{
    margin-top:10px;
    text-align:left;
    font-size:13px;
    max-height:120px;
    overflow:auto;
    padding:10px;
    background:rgba(255,255,255,0.05);
    border-radius:8px;
}

/* ===== ANIMATIONS ===== */

.shake{
    animation:shake 0.3s;
}

@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}
    100%{transform:translateX(0)}
}

/* WIN */
.winFlash{
    animation:winFlash 0.8s;
}

@keyframes winFlash{
    0%{box-shadow:0 0 0px green}
    50%{box-shadow:0 0 40px green}
    100%{box-shadow:0 0 0px green}
}

/* LOSE */
.loseShake{
    animation:loseShake 0.5s;
}

@keyframes loseShake{
    0%{transform:scale(1)}
    25%{transform:scale(1.05)}
    50%{transform:scale(0.95)}
    100%{transform:scale(1)}
}

.overlay{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:26px;
    background:rgba(0,0,0,0.6);
    border-radius:16px;
}

</style>
</head>

<body>

<div class="gameBox" id="box">

<h1>Guess Game</h1>

<select id="level">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
</select>

<input type="number" id="guess" placeholder="Enter number">

<button onclick="checkGuess()">Submit</button>

<div class="meta">
    <div>Attempts: <span id="left">10</span></div>
    <div>Score: <span id="score">0</span></div>
</div>

<p id="msg"></p>

<div id="history"></div>

<div class="overlay" id="overlay"></div>

</div>

<script>

/* ===== SOUND ENGINE (بدون ملفات) ===== */
function sound(type){
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let o = ctx.createOscillator();
    let g = ctx.createGain();

    o.connect(g);
    g.connect(ctx.destination);

    if(type==="win"){
        o.frequency.value = 800;
    }else if(type==="lose"){
        o.frequency.value = 120;
    }else{
        o.frequency.value = 300;
    }

    g.gain.value = 0.2;
    o.start();
    setTimeout(()=>o.stop(),150);
}

/* ===== GAME ===== */
let secret = 0;
let attempts = 10;
let score = 0;
let max = 100;
let history = [];

function start(){
    let level = document.getElementById("level").value;

    if(level==="easy") max=50;
    else if(level==="medium") max=100;
    else max=200;

    secret = Math.floor(Math.random()*max)+1;
    attempts = 10;
    history = [];

    document.getElementById("left").innerText = attempts;
    document.getElementById("history").innerHTML = "";
}

function checkGuess(){

    let val = Number(document.getElementById("guess").value);
    let box = document.getElementById("box");

    if(!val || val<1 || val>max){
        box.classList.add("shake");
        setTimeout(()=>box.classList.remove("shake"),300);
        sound("error");
        return;
    }

    attempts--;
    document.getElementById("left").innerText = attempts;

    let msg = "";

    if(val < secret){
        msg = `📈 الرقم المطلوب أعلى من ${val}`;
    }
    else if(val > secret){
        msg = `📉 الرقم المطلوب أقل من ${val}`;
    }
    else{
        msg = `🎉 صح! الرقم هو ${secret}`;
    }

    history.push(val + " → " + msg);
    document.getElementById("history").innerHTML =
        history.map(h=>`<div>${h}</div>`).join("");

    document.getElementById("msg").innerText = msg;

    sound("click");

    /* WIN */
    if(val === secret){
        score += attempts * 10;
        document.getElementById("score").innerText = score;

        sound("win");

        box.classList.add("winFlash");

        document.getElementById("overlay").style.display="flex";
        document.getElementById("overlay").innerText="YOU WIN 🎉";

        setTimeout(()=>{
            document.getElementById("overlay").style.display="none";
            box.classList.remove("winFlash");
            start();
        },2000);

        return;
    }

    /* LOSE */
    if(attempts === 0){
        sound("lose");

        box.classList.add("loseShake");

        document.getElementById("overlay").style.display="flex";
        document.getElementById("overlay").innerText="YOU LOSE 💀";

        setTimeout(()=>{
            document.getElementById("overlay").style.display="none";
            box.classList.remove("loseShake");
            start();
        },2000);
    }

}

document.getElementById("level").addEventListener("change",start);

start();

</script>

</body>
</html>
