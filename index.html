<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess Game</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top,#141a33,#070a14);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.gameBox{
    width:360px;
    padding:20px;
    background: rgba(255,255,255,0.05);
    border-radius:16px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    text-align:center;
}

h1{
    margin-bottom:10px;
}

select, input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    padding:10px;
    background:#6c5ce7;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#a29bfe;
}

.meta{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-top:10px;
}

#history{
    margin-top:10px;
    font-size:13px;
    text-align:left;
    max-height:120px;
    overflow:auto;
    background:rgba(255,255,255,0.05);
    padding:10px;
    border-radius:8px;
}

.overlay{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:22px;
    border-radius:16px;
}

#ad-container{
    margin-top:20px;
    width:360px;
    text-align:center;
}
</style>

</head>
<body>

<div class="gameBox">

<h1>Guess Game</h1>

<select id="level">
    <option value="easy">Easy (1-50)</option>
    <option value="medium">Medium (1-100)</option>
    <option value="hard">Hard (1-200)</option>
</select>

<input type="number" id="guess" placeholder="Enter number">

<button onclick="checkGuess()">Submit</button>

<div class="meta">
    <div>Attempts: <span id="left">10</span></div>
    <div>Score: <span id="score">0</span></div>
</div>

<div class="meta">
    <div>High Score: <span id="high">0</span></div>
</div>

<div id="history"></div>

<p id="msg"></p>

<div class="overlay" id="overlay"></div>

</div>

<!-- 🔥 ADS AREA -->
<div id="ad-container">
    <!-- ADS HERE -->
<div id="ad-container">

    <script type="text/javascript">
        atOptions = {
            'key' : '389d78db7f9cbf6dd8351bf78f504954',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
        };
    </script>

    <script async="async" data-cfasync="false"
        src="https://pl29701493.effectivecpmnetwork.com/033a44687247c8e8df2d89f7c68bd9db/invoke.js">
    </script>

</div>
</div>

<script>

let secret, max = 100;
let attempts = 10;
let score = 0;
let history = [];

let high = localStorage.getItem("highScore") || 0;
document.getElementById("high").innerText = high;

function startGame(){

    let level = document.getElementById("level").value;

    if(level === "easy") max = 50;
    else if(level === "medium") max = 100;
    else max = 200;

    secret = Math.floor(Math.random() * max) + 1;
    attempts = 10;
    history = [];

    document.getElementById("left").innerText = attempts;
    document.getElementById("msg").innerText = "";
    document.getElementById("history").innerHTML = "";
}

function checkGuess(){

    let input = document.getElementById("guess");
    let value = Number(input.value);

    if(!value || value < 1 || value > max){
        return;
    }

    attempts--;
    document.getElementById("left").innerText = attempts;

    let message = "";

    if(value < secret){
        message = `الرقم المطلوب أعلى من ${value}`;
    }
    else if(value > secret){
        message = `الرقم المطلوب أقل من ${value}`;
    }
    else{
        message = `مبروك 🎉 الرقم الصحيح هو ${secret}`;
    }

    history.push(`أنت خمنت ${value} → ${message}`);

    document.getElementById("history").innerHTML =
        history.map(h => `<div>• ${h}</div>`).join("");

    document.getElementById("msg").innerText = message;

    input.value = "";

    if(value === secret){
        score += attempts * 10;
        document.getElementById("score").innerText = score;

        if(score > high){
            high = score;
            localStorage.setItem("highScore", high);
            document.getElementById("high").innerText = high;
        }

        setTimeout(startGame, 2000);
        return;
    }

    if(attempts === 0){
        document.getElementById("msg").innerText =
        `خسرت 😅 الرقم كان ${secret}`;

        setTimeout(startGame, 2000);
    }
}

document.getElementById("level").addEventListener("change", startGame);

startGame();

</script>

</body>
</html>
