<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Guess RPG Ultimate</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#05060a;
    color:white;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* PARTICLES */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

.container{
    position:relative;
    z-index:2;
}

/* CARD */
.gameBox{
    width:390px;
    padding:20px;
    border-radius:16px;
    background:rgba(0,255,255,0.05);
    border:1px solid rgba(0,255,255,0.2);
    box-shadow:0 0 25px rgba(0,255,255,0.2);
    text-align:center;
    backdrop-filter: blur(10px);
}

h1{
    color:#00fff2;
    text-shadow:0 0 10px #00fff2;
}

select,input{
    width:100%;
    padding:10px;
    margin:6px 0;
    background:#0b0f1a;
    border:none;
    color:white;
    border-radius:8px;
}

button{
    width:100%;
    padding:10px;
    background:#00fff2;
    border:none;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #00fff2;
}

/* META */
.meta{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-top:10px;
    color:#aefcff;
}

/* HISTORY */
#history{
    margin-top:10px;
    text-align:left;
    font-size:12px;
    max-height:120px;
    overflow:auto;
    padding:8px;
    background:rgba(0,255,255,0.05);
    border-radius:8px;
}

/* XP BAR */
.xpBar{
    width:100%;
    height:8px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.xpFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00fff2,#00ff7b);
    transition:0.3s;
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:28px;
    background:rgba(0,0,0,0.6);
    border-radius:16px;
}

/* ANIMATION */
.shake{animation:shake 0.3s}
@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    100%{transform:translateX(0)}
}

.winGlow{animation:win 0.7s}
@keyframes win{
    0%{box-shadow:0 0 0 cyan}
    50%{box-shadow:0 0 40px cyan}
    100%{box-shadow:0 0 0 cyan}
}

.loseGlow{animation:lose 0.5s}
@keyframes lose{
    0%{transform:scale(1)}
    50%{transform:scale(0.95)}
    100%{transform:scale(1)}
}

/* ADS */
#ad-container{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<div class="gameBox" id="box">

<h1>CYBER GUESS</h1>

<select id="level">
    <option value="easy">EASY (1-50)</option>
    <option value="medium">MEDIUM (1-100)</option>
    <option value="hard">HARD (1-200)</option>
</select>

<input type="number" id="guess" placeholder="ENTER NUMBER">
<button onclick="checkGuess()">HACK</button>

<div class="meta">
    <div>TRIES: <span id="left">10</span></div>
    <div>SCORE: <span id="score">0</span></div>
</div>

<div class="meta">
    <div>LEVEL: <span id="lvl">1</span></div>
    <div>XP: <span id="xp">0</span></div>
</div>

<div class="xpBar"><div class="xpFill" id="xpFill"></div></div>

<div id="history"></div>

<div class="overlay" id="overlay"></div>

</div>

<!-- ADS -->
<div id="ad-container">
    <!-- ADS HERE -->
<div id="ad-container">

    <script type="text/javascript">
        atOptions = {
            'key' : '389d78db7f9cbf6dd8351bf78f504954',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
        };
    </script>

    <script async="async" data-cfasync="false"
        src="https://pl29701493.effectivecpmnetwork.com/033a44687247c8e8df2d89f7c68bd9db/invoke.js">
    </script>

</div>
</div>

</div>

<script>

/* ===== PARTICLES ===== */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let p=[];
for(let i=0;i<80;i++){
    p.push({x:Math.random()*c.width,y:Math.random()*c.height,r:2,dx:(Math.random()-0.5),dy:(Math.random()-0.5)});
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="#00fff2";
    p.forEach(e=>{
        e.x+=e.dx;
        e.y+=e.dy;
        if(e.x<0||e.x>c.width)e.dx*=-1;
        if(e.y<0||e.y>c.height)e.dy*=-1;
        ctx.beginPath();
        ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(draw);
}
draw();

/* ===== SOUND ===== */
function sound(t){
    let a=new AudioContext();
    let o=a.createOscillator();
    let g=a.createGain();

    o.connect(g);g.connect(a.destination);

    o.frequency.value = t==="win"?900:t==="lose"?120:300;

    g.gain.value=0.2;
    o.start();
    setTimeout(()=>o.stop(),120);
}

/* ===== GAME ===== */
let secret,attempts=10,score=0,max=100;
let xp=0,level=1,history=[];

let high=localStorage.getItem("high")||0;

/* DAILY */
let today=new Date().toDateString();
if(localStorage.getItem("day")!==today){
    localStorage.setItem("day",today);
    xp+=30;
    score+=50;
}

function start(){

    let l=level.value;

    max=l==="easy"?50:l==="medium"?100:200;

    secret=Math.floor(Math.random()*max)+1;
    attempts=10;
    history=[];
    left.textContent=attempts;
    historyBox();
}

function checkGuess(){

    let v=+guess.value;
    let box=document.getElementById("box");

    if(!v||v<1||v>max){
        box.classList.add("shake");
        setTimeout(()=>box.classList.remove("shake"),300);
        return;
    }

    attempts--;
    left.textContent=attempts;

    let msg=v<secret?`↑ أعلى من ${v}`:v>secret?`↓ أقل من ${v}`:"✔ صح";

    history.push(v+" → "+msg);
    historyBox();

    sound("click");

    if(v===secret){

        score+=attempts*10;
        xp+=20;

        if(xp>=100){
            xp=0;
            levelNum();
        }

        if(score>high){
            high=score;
            localStorage.setItem("high",high);
        }

        sound("win");
        box.classList.add("winGlow");
        show("WIN 🎉");

        setTimeout(()=>{hide();start();},2000);
        return;
    }

    if(attempts===0){
        sound("lose");
        box.classList.add("loseGlow");
        show("LOSE 💀");
        setTimeout(()=>{hide();start();},2000);
    }

    updateUI();
}

function levelNum(){
    level.textContent=++level;
}

function updateUI(){
    scoreEl.textContent=score;
    xpEl.textContent=xp;
    lvl.textContent=level;
    xpFill.style.width=xp+"%";
}

function historyBox(){
    historyEl.innerHTML=history.map(h=>`<div>${h}</div>`).join("");
}

function show(t){
    overlay.style.display="flex";
    overlay.textContent=t;
}

function hide(){
    overlay.style.display="none";
}

start();

</script>

</body>
</html>
