<h1>Number Guessing Game</h1>

<p>Try and guess a random number between 1 and 100.</p>
<p>You have 10 attempts to guess the right number.</p>

<div id="wrapper">

    <form class="form">
        <label for="guessField" id="guess">Guess a number</label>

        <input 
            type="number" 
            id="guessField" 
            class="guessField"
            min="1"
            max="100"
            autocomplete="off"
        >

        <input 
            type="submit" 
            id="subt" 
            value="Submit guess" 
            class="guessSubmit"
        >
    </form>

    <div class="resultParas">
        <p>Previous Guesses: <span class="guesses"></span></p>
        <p>Guesses Remaining: <span class="lastResult">10</span></p>
        <p class="lowOrHi"></p>
    </div>

</div>

<script>
    // Generate a random number between 1 and 100
let randomNumber = Math.floor(Math.random() * 100) + 1;

const submit = document.querySelector('#subt');
const userInput = document.querySelector('#guessField');
const guessSlot = document.querySelector('.guesses');
const remaining = document.querySelector('.lastResult');
const startOver = document.querySelector('.resultParas');
const lowOrHi = document.querySelector('.lowOrHi');

const p = document.createElement('p');

let previousGuesses = [];
let numGuesses = 0;
let playGame = true;

const maxGuesses = 10;

// Event
submit.addEventListener("click", function (e) {
    e.preventDefault();
    if (!playGame) return;

    const guess = Number(userInput.value);
    validateGuess(guess);
});

// Validate input
function validateGuess(guess) {
    if (isNaN(guess)) {
        alert("ادخل رقم صحيح");
        return;
    }
    if (guess < 1 || guess > 100) {
        alert("الرقم لازم يكون بين 1 و 100");
        return;
    }

    previousGuesses.push(guess);
    numGuesses++;

    displayGuesses(guess);
    checkGuess(guess);
    checkGameOver();
}

// Check guess
function checkGuess(guess) {
    if (guess === randomNumber) {
        displayMessage(`فزت! الرقم الصحيح هو ${randomNumber}`);
        endGame();
    } else if (guess > randomNumber) {
        displayMessage("أعلى من الرقم المطلوب");
    } else {
        displayMessage("أقل من الرقم المطلوب");
    }
}

// Update UI guesses
function displayGuesses(guess) {
    userInput.value = "";
    guessSlot.innerHTML += `${guess} `;
    remaining.innerHTML = `${maxGuesses - numGuesses}`;
}

// Check game over
function checkGameOver() {
    if (numGuesses >= maxGuesses && previousGuesses[previousGuesses.length - 1] !== randomNumber) {
        displayMessage(`خسرت! الرقم كان ${randomNumber}`);
        endGame();
    }
}

// Show message
function displayMessage(message) {
    lowOrHi.innerHTML = `<h2>${message}</h2>`;
}

// End game
function endGame() {
    userInput.setAttribute("disabled", "");

    p.classList.add("button");
    p.innerHTML = `<h2 id="newgame">ابدأ لعبة جديدة</h2>`;
    startOver.appendChild(p);

    playGame = false;

    newGame();
}

// Restart game
function newGame() {
    const newGameButton = document.querySelector("#newgame");

    newGameButton.addEventListener("click", function () {
        randomNumber = Math.floor(Math.random() * 100) + 1;

        previousGuesses = [];
        numGuesses = 0;
        playGame = true;

        guessSlot.innerHTML = "";
        lowOrHi.innerHTML = "";
        remaining.innerHTML = maxGuesses;

        userInput.removeAttribute("disabled");
        userInput.value = "";

        startOver.removeChild(p);
    });
}
</script>

<style>
    /* ===== BASE ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-family: "Segoe UI", sans-serif;

}

}

/* ===== TEXT ===== */

/* ===== LABEL ===== */

}

/* ===== INPUT ===== */
#guessField {
    width: 100%;
    padding: 15px;
    font-size: 26px;
    text-align: center;
    border-radius: 14px;
    border: none;
    outline: none;
    background: rgba(0,0,0,0.4);
    color: #fff;

}

#guessField:focus {

/* ===== BUTTON ===== */
#subt {
    width: 100%;

    background: linear-gradient(90deg, #00f5ff, #7b2ff7);

}

#subt:hover {

    box-shadow: 0 0 25px rgba(0,245,255,0.5);
}

/* ===== RESULT BOX ===== */
.resultParas {
    margin-top: 20px;
    text-align: center;
}

.guesses, .lastResult {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    animation: fadeIn 0.5s ease;
}

/* ===== MESSAGE ===== */
.lowOrHi h1 {
    font-size: 20px;
    margin-top: 15px;
    animation: pulse 1s infinite;
}

/* ===== NEW GAME ===== */
.button {
    margin-top: 20px;
    cursor: pointer;
    animation: popIn 0.4s ease;
}

#newgame {
    padding: 12px;
    border-radius: 14px;
    text-align: center;
    background: linear-gradient(90deg, #ff4d6d, #ffcc00);
    color: #000;
    font-weight: bold;
    transition: 0.3s;
}

#newgame:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(255,77,109,0.4);
}

/* ===== ANIMATIONS ===== */
@keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

/* ===== SHAKE EFFECT (FOR JS) ===== */
.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0% { transform: translate(0); }
    20% { transform: translate(-8px, 5px); }
    40% { transform: translate(8px, -5px); }
    60% { transform: translate(-8px, 5px); }
    80% { transform: translate(8px, -5px); }
    100% { transform: translate(0); }
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
    h1 {
        font-size: 22px;
    }

    }

    }
}
