    <meta name="description" content="Cyber Guess هي لعبة تخمين أرقام بأسلوب سايبر/نيون سريعة الإيقاع، تعتمد على الذكاء والحدس. تختار مستوى الصعوبة (سهل، متوسط، صعب) وكل مستوى يغيّر نطاق الأرقام تلقائيًا، وعندك 10 محاولات فقط عشان توصل للرقم الصحيح.

اللعبة فيها نظام نقاط (Score) يزيد حسب أدائك وعدد المحاولات المتبقية، مع نظام خبرة (XP) وترقية مستويات (Level Up) يخليك تحس بتقدم مستمر. كمان يتم حفظ أعلى نتيجة (High Score) على الجهاز عشان تنافس نفسك كل مرة.

كل تخمين يعطيك ملاحظات فورية تساعدك تقرّب من الرقم الصحيح، مع سجل (History) يوضح محاولاتك السابقة. الخلفية متحركة بتأثيرات جسيمات (Particle FX) تعطي طابع سايبربنك، مع واجهة نيون خفيفة تركز على التجربة السريعة.

اللعبة مصممة لتكون سهلة الدخول لكنها صعبة الإتقان، وتدفعك تعيد المحاولة أكثر من مرة لتحسين نتيجتك وكسر رقمك القياسي.">

    <style>
    

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
radial-gradient(circle at top left,#7c3aed 0%,transparent 30%),
radial-gradient(circle at bottom right,#2563eb 0%,transparent 30%),
linear-gradient(135deg,#0f172a,#020617);
color:white;
overflow-x:hidden;
}

.container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.gameBox{
width:420px;
max-width:100%;
padding:25px;
border-radius:28px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:
0 20px 60px rgba(0,0,0,.4),
0 0 30px rgba(124,58,237,.25);
position:relative;
overflow:hidden;
}

.gameBox::before{
content:"";
position:absolute;
top:-100px;
right:-100px;
width:220px;
height:220px;
background:rgba(124,58,237,.25);
border-radius:50%;
filter:blur(60px);
}

.gameBox::after{
content:"";
position:absolute;
bottom:-100px;
left:-100px;
width:220px;
height:220px;
background:rgba(37,99,235,.25);
border-radius:50%;
filter:blur(60px);
}

h1{
text-align:center;
margin-bottom:18px;
font-size:32px;
font-weight:800;
letter-spacing:2px;
background:linear-gradient(90deg,#60a5fa,#a78bfa);
-webkit-text-fill-color:transparent;
}

select,
input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
outline:none;
}

select:focus,
input:focus{
box-shadow:0 0 0 2px #60a5fa;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:14px;
font-size:15px;
font-weight:700;
cursor:pointer;
color:white;
background:linear-gradient(135deg,#2563eb,#7c3aed);
transition:.25s;
}

button:hover{
transform:translateY(-2px);
}

.meta{
display:flex;
gap:10px;
margin-top:12px;
}

.meta div{
flex:1;
background:rgba(255,255,255,.06);
padding:10px;
border-radius:12px;
text-align:center;
font-size:13px;
}

.xpBar{
width:100%;
height:10px;
background:rgba(255,255,255,.08);
border-radius:999px;
overflow:hidden;
margin-top:15px;
}

.xpFill{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#3b82f6);
transition:.4s;
}

#history{
margin-top:15px;
max-height:150px;
overflow:auto;
padding:10px;
border-radius:12px;
background:rgba(255,255,255,.05);
}

#history div{
padding:8px;
margin-bottom:6px;
border-radius:10px;
background:rgba(255,255,255,.04);
font-size:13px;
}

.overlay{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
background:rgba(0,0,0,.75);
backdrop-filter:blur(5px);
z-index:20;
}

.shake{
animation:shake .3s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-6px)}
50%{transform:translateX(6px)}
75%{transform:translateX(-6px)}
100%{transform:translateX(0)}
}

#ad-container{
margin-top:15px;
display:flex;
justify-content:center;
align-items:center;
}

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#7c3aed;
border-radius:20px;
}

body{
padding:12px;
}

.gameBox{
padding:18px;
border-radius:22px;
}

h1{
font-size:26px;
}

.meta{
flex-direction:column;
}

}

<body>


    <div class="container">

        <div class="gameBox" id="box">

            <h1>CYBER GUESS</h1>

            <select id="level">
                <option value="easy">EASY (1-50)</option>
                <option value="medium">MEDIUM (1-100)</option>
                <option value="hard">HARD (1-200)</option>
            </select>

            <input type="number" id="guess" placeholder="ENTER NUMBER">
            <button onclick="checkGuess()">HACK</button>

            <div class="meta">
                <div>TRIES: <span id="left">10</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>

            <div class="meta">
                <div>LEVEL: <span id="lvl">1</span></div>
                <div>XP: <span id="xp">0</span></div>
            </div>

            <div class="meta">
                <div>HIGH SCORE: <span id="high">0</span></div>
            </div>

            <div class="xpBar">
                <div class="xpFill" id="xpFill"></div>
            </div>

            <div id="history"></div>

            <div class="overlay" id="overlay"></div>




        </div>
           <div class="ad-container">
        <script>
            atOptions = {
                'key': '389d78db7f9cbf6dd8351bf78f504954',
                'format': 'iframe',
                'height': 50,
                'width': 320,
                'params': {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/389d78db7f9cbf6dd8351bf78f504954/invoke.js"></script>
    </div>
    </div>

 



    <script>
    

        /* ===== GAME ===== */
        let secret;
        let attempts = 10;
        let score = 0;
        let xp = 0;
        let level = 1;
        let max = 50;
        let history = [];

        let high = Number(localStorage.getItem("high")) || 0;
        document.getElementById("high").textContent = high;

        let overlay = document.getElementById("overlay");

        let today = new Date().toDateString();
        if (localStorage.getItem("daily") !== today) {
            localStorage.setItem("daily", today);
            xp += 30;
            score += 50;
        }

        function setLevel() {
            let l = document.getElementById("level").value;

            if (l === "easy") max = 50;
            else if (l === "medium") max = 100;
            else max = 200;

            secret = Math.floor(Math.random() * max) + 1;
            attempts = 10;
            history = [];

            document.getElementById("left").textContent = attempts;
            document.getElementById("history").innerHTML = "";
            document.getElementById("guess").value = "";
        }

        function updateUI() {
            document.getElementById("score").textContent = score;
            document.getElementById("xp").textContent = xp;
            document.getElementById("lvl").textContent = level;

            document.getElementById("xpFill").style.width = (xp / 100) * 100 + "%";
        }

        function show(t) {
            overlay.style.display = "flex";
            overlay.textContent = t;
        }

        function hide() {
            overlay.style.display = "none";
        }

        function checkGuess() {

            let v = Number(document.getElementById("guess").value);
            let box = document.getElementById("box");

            if (isNaN(v) || v < 1 || v > max) {
                box.classList.add("shake");
                setTimeout(() => box.classList.remove("shake"), 300);
                alert("ادخل رقم بين 1 و " + max);
                return;
            }

            attempts--;
            document.getElementById("left").textContent = attempts;

            let msg = "";

            if (v < secret) msg = "↑ أعلى من " + v;
            else if (v > secret) msg = "↓ أقل من " + v;
            else msg = "✔ صح";

            history.push(v + " → " + msg);

            document.getElementById("history").innerHTML =
                history.map(h => `<div>${h}</div>`).join("");

            if (v === secret) {

                score += attempts * 10;
                xp += 20;

                if (xp >= 100) {
                    xp = 0;
                    level++;
                }

                if (score > high) {
                    high = score;
                    localStorage.setItem("high", high);
                }

                document.getElementById("high").textContent = high;
                updateUI();

                show("WIN 🎉");

                setTimeout(() => {
                    hide();
                    setLevel();
                }, 2000);

                return;
            }

            if (attempts === 0) {
                show("LOSE 💀");

                setTimeout(() => {
                    hide();
                    setLevel();
                }, 2000);
            }

            document.getElementById("guess").value = "";
            document.getElementById("guess").focus();

            updateUI();
        }

        document.getElementById("level").addEventListener("change", setLevel);

        document.getElementById("guess").addEventListener("keydown", e => {
            if (e.key === "Enter") checkGuess();
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js")
                .then(() => console.log("SW Registered"))
                .catch(err => console.log(err));
        }


        setLevel();
        updateUI();
    </script>

</body>
